<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RepoLens</title>
</head>
<body>
    <h1>RepoLens Code Diagnosis</h1>

    <label for="question">Problem description:</label>
    <br>
    <textarea id="question" rows="5" cols="60"></textarea>
    <br>

    <button id="submit" type="button">Diagnose</button>

    <h2>Result</h2>
    <pre id="result" style="white-space: pre-wrap">Waiting for a diagnosis</pre>

    <details>
        <summary>Tool calls</summary>
        <pre id="trace" style="white-space: pre-wrap">No tool calls yet</pre>
    </details>

    <script>
        const questionInput = document.getElementById("question");
        const submitButton = document.getElementById("submit");
        const resultOutput = document.getElementById("result");
        const traceOutput = document.getElementById("trace");

        function renderTrace(trace) {
            const results = {};
            for (const item of trace) {
                if (item.role === "tool") {
                    results[item.tool_call_id] = JSON.parse(item.content);
                }
            }

            traceOutput.textContent = trace
                .filter(item => item.role === "assistant" && item.tool_calls)
                .flatMap(item => item.tool_calls)
                .map((call, index) => {
                    const result = results[call.id];
                    const resultText = typeof result.content === "string"
                        ? result.content
                        : JSON.stringify(result, null, 2);
                    return `${index + 1}. ${call.function.name} ${call.function.arguments}\n${resultText}`;
                })
                .join("\n\n") || "No tool calls";
        }

        function renderReport(report) {
            const statusText = report.status === "hypothesis"
                ? "Root-cause hypothesis (unverified)"
                : "Insufficient evidence";

            const evidenceText = report.evidence.map((item, index) => {
                return `${index + 1}. ${item.path}:${item.start_line}-${item.end_line}\n${item.code}`;
            }).join("\n\n") || "No code evidence";

            const verificationText = report.verification.map((step, index) => {
                return `${index + 1}. ${step}`;
            }).join("\n") || "No verification steps";

            const missingText = report.missing_information.map((item, index) => {
                return `${index + 1}. ${item}`;
            }).join("\n") || "No missing information";

            resultOutput.textContent = [
                `Status: ${statusText}`,
                "",
                "Summary", report.summary,
                "",
                "Root cause (inferred, unverified)", report.root_cause || "None",
                "",
                "Code evidence", evidenceText,
                "",
                "Suggestion", report.suggestion,
                "",
                "Verification steps (not run yet)", verificationText,
                "",
                "Missing information", missingText
            ].join("\n");
        }

        submitButton.addEventListener("click", async () => {
            const question = questionInput.value.trim();

            if (!question) {
                resultOutput.textContent = "Please enter a problem description";
                return;
            }

            submitButton.disabled = true;
            resultOutput.textContent = "Diagnosing, please wait...";
            traceOutput.textContent = "No tool calls yet";

            try {
                const response = await fetch("/api/diagnose", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                renderTrace(data.trace);

                if (data.report) {
                    renderReport(data.report);
                } else {
                    resultOutput.textContent = `Diagnosis failed: ${data.error}`;
                }
            } catch (error) {
                resultOutput.textContent = `Diagnosis failed: ${error.message}`;
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
