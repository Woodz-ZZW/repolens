<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RepoLens</title>
</head>
<body>
    <h1>RepoLens 代码诊断助手</h1>

    <label for="question">问题描述：</label>
    <br>
    <textarea id="question" rows="5" cols="60"></textarea>
    <br>

    <button id="submit" type="button">开始诊断</button>

    <h2>诊断结果</h2>
    <pre id="result" style="white-space: pre-wrap">等待诊断结果</pre>

    <details>
        <summary>工具记录</summary>
        <pre id="trace" style="white-space: pre-wrap">暂无工具记录</pre>
    </details>

    <script>
        const questionInput = document.getElementById("question");
        const submitButton = document.getElementById("submit");
        const resultOutput = document.getElementById("result");
        const traceOutput = document.getElementById("trace");

        function renderTrace(trace) {
            const results = {};
            for (const item of trace) {
                if (item.role === "tool") {
                    results[item.tool_call_id] = JSON.parse(item.content);
                }
            }

            traceOutput.textContent = trace
                .filter(item => item.role === "assistant" && item.tool_calls)
                .flatMap(item => item.tool_calls)
                .map((call, index) => {
                    const result = results[call.id];
                    const resultText = typeof result.content === "string"
                        ? result.content
                        : JSON.stringify(result, null, 2);
                    return `${index + 1}. ${call.function.name} ${call.function.arguments}\n${resultText}`;
                })
                .join("\n\n") || "没有工具调用";
        }

        function renderReport(report) {
            const statusText = report.status === "hypothesis"
                ? "根因假设（待验证）"
                : "证据不足";

            const evidenceText = report.evidence.map((item, index) => {
                return `${index + 1}. ${item.path}:${item.start_line}-${item.end_line}\n${item.code}`;
            }).join("\n\n") || "暂无代码证据";

            const verificationText = report.verification.map((step, index) => {
                return `${index + 1}. ${step}`;
            }).join("\n") || "暂无验证步骤";

            const missingText = report.missing_information.map((item, index) => {
                return `${index + 1}. ${item}`;
            }).join("\n") || "暂无待补充信息";

            resultOutput.textContent = [
                `诊断状态：${statusText}`,
                "",
                "诊断摘要", report.summary,
                "",
                "根因假设（推断，待验证）", report.root_cause || "无",
                "",
                "代码证据", evidenceText,
                "",
                "处理建议", report.suggestion,
                "",
                "验证步骤（尚未执行）", verificationText,
                "",
                "待补充信息", missingText
            ].join("\n");
        }

        submitButton.addEventListener("click", async () => {
            const question = questionInput.value.trim();

            if (!question) {
                resultOutput.textContent = "请输入问题描述";
                return;
            }

            submitButton.disabled = true;
            resultOutput.textContent = "正在诊断，请稍候……";
            traceOutput.textContent = "暂无工具记录";

            try {
                const response = await fetch("/api/diagnose", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}：${errorText}`);
                }

                const data = await response.json();
                renderTrace(data.trace);

                if (data.report) {
                    renderReport(data.report);
                } else {
                    resultOutput.textContent = `诊断失败：${data.error}`;
                }
            } catch (error) {
                resultOutput.textContent = `诊断失败：${error.message}`;
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
